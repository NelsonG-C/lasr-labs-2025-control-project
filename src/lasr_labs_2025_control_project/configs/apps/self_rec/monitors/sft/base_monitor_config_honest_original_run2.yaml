experiment_folder: experiments/apps/control_self_rec

results_folder: results/original/none_sft_honest/run_2/

experiment_name: Self Rec SFT Honest (Original, Run 2)

defaults:
  monitors:
    - untrusted_collusion_monitor:
        model_info:
          model: openai/ft:gpt-4.1-2025-04-14:lasr-labs:gemini-2-5-flash-honest:CQmnG0bI
          system_prompt: SELF_REC_UNTRUSTED_MONITOR_COLLUSION_SYSTEM_PROMPT
          base_prompt: MONITOR_USER_PROMPT
        remove_comments: true
        transformed: false

    - trusted_backdoor_monitor:
        model_info:
          model: openai/gpt-4o-mini
          system_prompt: DEFAULT_HONEST_MONITOR_SYSTEM_PROMPT
          base_prompt: MONITOR_USER_PROMPT
        remove_comments: true
        transformed: false

    - untrusted_backdoor_monitor:
        model_info:
          model: openai/gpt-4.1-2025-04-14
          system_prompt: DEFAULT_HONEST_MONITOR_SYSTEM_PROMPT
          base_prompt: MONITOR_USER_PROMPT
        remove_comments: true
        transformed: false
runs:
  attacks:
    eval_path: generator/original/attacks.eval
    save_path: outputs/original/none_sft_honest/run_2/attack_monitor_results.eval
    monitors:
      - untrusted_collusion_monitor
      - trusted_backdoor_monitor
      - untrusted_backdoor_monitor

  honest:
    eval_path: generator/original/honest.eval
    save_path: outputs/original/none_sft_honest/honest_monitor_results.eval  # shared with run_1: benign scores are SFT-invariant
    monitors:
      - untrusted_collusion_monitor
      - trusted_backdoor_monitor
      - untrusted_backdoor_monitor

  honeypots:
    eval_path: generator/original/honeypots.eval
    save_path: outputs/original/none_sft_honest/run_2/honeypots_monitor_results.eval
    monitors:
      - untrusted_collusion_monitor
      - trusted_backdoor_monitor
      - untrusted_backdoor_monitor
